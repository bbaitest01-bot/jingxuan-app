name: Deploy Flutter Web to Vercel

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Create Env File from Secrets
        run: |
          echo "SUPABASE_URL=${{ secrets.SUPABASE_URL }}" > .env
          echo "SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}" >> .env

      - name: Build Web
        run: flutter build web --release

      # 不用 Flutter 的離線快取：換成清快取程式，舊瀏覽器會自動清掉快取、載入最新版（2026-10-25）
      - name: Replace Service Worker With Cleanup Script
        run: cp tool/service_worker_cleanup.js build/web/flutter_service_worker.js

      - name: Install Vercel CLI
        run: npm install --global vercel

      - name: Pull Vercel Environment Information
        run: vercel pull --yes --environment=production --token=$VERCEL_TOKEN

      - name: Build Vercel Project Structure
        run: vercel build --prod --token=$VERCEL_TOKEN

      - name: Sync Flutter Web Build to Vercel Output
        run: rsync -av build/web/ .vercel/output/static/

      - name: Deploy Prebuilt Artifacts to Vercel Production
        run: vercel deploy --prebuilt --prod --token=$VERCEL_TOKEN
