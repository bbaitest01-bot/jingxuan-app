name: 📰 Daily Insurance News Crawler & AI Summarizer

on:
  schedule:
    # 台灣時間 一天兩更：早上 06:00 (UTC 22:00) 晨報 與 傍晚 18:00 (UTC 10:00) 夕報
    - cron: '0 10,22 * * *'
  workflow_dispatch: # 支援手動於 GitHub 點擊 Trigger 測試

jobs:
  fetch-news:
    runs-on: ubuntu-latest
    steps:
      - name: 🚀 Trigger Supabase Edge Function (fetch-insurance-news)
        env:
          NEWS_CRON_SECRET: ${{ secrets.NEWS_CRON_SECRET }}
        run: |
          echo "Sending POST request to fetch-insurance-news Edge Function..."
          
          # 沒設定 Secret 就直接失敗，避免不帶密碼呼叫、問題被藏起來
          if [ -z "$NEWS_CRON_SECRET" ]; then
            echo "❌ Error: GitHub Secret NEWS_CRON_SECRET 尚未設定"
            exit 1
          fi

          # 函式不檢查 JWT（Verify JWT 關閉），改由函式比對 x-news-cron-secret 排程密碼
          # User-Agent 標上來源 repo，方便在 Supabase 函式紀錄分辨是誰觸發的
          response=$(curl -s -w "\n%{http_code}" -X POST \
            -A "jingxuan-app/daily-news" \
            "https://algufuoxkeizxwkofmmp.supabase.co/functions/v1/fetch-insurance-news" \
            -H "Content-Type: application/json" \
            -H "x-news-cron-secret: $NEWS_CRON_SECRET")
          
          http_code=$(echo "$response" | tail -n 1)
          body=$(echo "$response" | sed '$d')
          
          echo "HTTP Response Code: $http_code"
          echo "Response Body: $body"
          
          if [ "$http_code" -ne 200 ]; then
            echo "❌ Error: Edge Function failed with status $http_code"
            exit 1
          fi
          
          echo "✅ Successfully fetched and updated daily insurance news!"
